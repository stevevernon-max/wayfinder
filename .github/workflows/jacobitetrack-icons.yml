name: JacobiteTrack Home Screen icons
on:
  push:
    paths:
      - 'jacobitetrack/icon.svg'
      - 'jacobitetrack/manifest.webmanifest'
      - '.github/workflows/jacobitetrack-icons.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  icons:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Render iOS and PWA icon sizes
        run: |
          python -m pip install cairosvg
          python - <<'PY'
          import cairosvg
          for size in (180, 192, 512):
              cairosvg.svg2png(url="jacobitetrack/icon.svg",write_to=f"jacobitetrack/icon-{size}.png",output_width=size,output_height=size)
          PY
      - name: Commit generated icons
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add jacobitetrack/icon-180.png jacobitetrack/icon-192.png jacobitetrack/icon-512.png
          if ! git diff --staged --quiet; then
            git commit -m "Generate JacobiteTrack PNG Home Screen icons"
            git push
          fi

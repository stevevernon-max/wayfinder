name: Refresh Darwin railway feed

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/darwin-feed.yml
      - jacobitetrack/scripts/darwin_feed.py
  schedule:
    # Avoid the busy top of the hour; GitHub may still delay scheduled runs.
    - cron: "2-59/5 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: darwin-feed
  cancel-in-progress: false

jobs:
  refresh:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out the site
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Kafka client
        run: python -m pip install --disable-pip-version-check 'confluent-kafka==2.6.1'

      - name: Collect Darwin updates
        env:
          RDM_MODE: darwin
          RDM_BOOTSTRAP_SERVERS: ${{ secrets.RDM_BOOTSTRAP_SERVERS }}
          RDM_CONSUMER_USERNAME: ${{ secrets.RDM_CONSUMER_USERNAME }}
          RDM_CONSUMER_PASSWORD: ${{ secrets.RDM_CONSUMER_PASSWORD }}
          RDM_GROUP_ID: ${{ secrets.RDM_GROUP_ID }}
          RDM_TOPIC: ${{ secrets.RDM_TOPIC }}
          # Leave time in the five-minute run for each supplementary stream.
          RDM_POLL_SECONDS: "75"
        run: python jacobitetrack/scripts/darwin_feed.py

      - name: Collect Network Rail movement reports
        env:
          RDM_MODE: movements
          RDM_NWR_BOOTSTRAP_SERVERS: ${{ secrets.RDM_NWR_BOOTSTRAP_SERVERS }}
          RDM_NWR_CONSUMER_USERNAME: ${{ secrets.RDM_NWR_CONSUMER_USERNAME }}
          RDM_NWR_CONSUMER_PASSWORD: ${{ secrets.RDM_NWR_CONSUMER_PASSWORD }}
          RDM_MOVEMENTS_GROUP_ID: ${{ secrets.RDM_MOVEMENTS_GROUP_ID }}
          RDM_MOVEMENTS_TOPIC: ${{ secrets.RDM_MOVEMENTS_TOPIC }}
          RDM_POLL_SECONDS: "12"
        run: python jacobitetrack/scripts/darwin_feed.py

      - name: Collect VSTP timetable changes
        env:
          RDM_MODE: vstp
          RDM_NWR_BOOTSTRAP_SERVERS: ${{ secrets.RDM_NWR_BOOTSTRAP_SERVERS }}
          RDM_NWR_CONSUMER_USERNAME: ${{ secrets.RDM_NWR_CONSUMER_USERNAME }}
          RDM_NWR_CONSUMER_PASSWORD: ${{ secrets.RDM_NWR_CONSUMER_PASSWORD }}
          RDM_VSTP_GROUP_ID: ${{ secrets.RDM_VSTP_GROUP_ID }}
          RDM_VSTP_TOPIC: ${{ secrets.RDM_VSTP_TOPIC }}
          RDM_POLL_SECONDS: "12"
        run: python jacobitetrack/scripts/darwin_feed.py

      - name: Collect Train Describer updates
        env:
          RDM_MODE: td
          RDM_NWR_BOOTSTRAP_SERVERS: ${{ secrets.RDM_NWR_BOOTSTRAP_SERVERS }}
          RDM_NWR_CONSUMER_USERNAME: ${{ secrets.RDM_NWR_CONSUMER_USERNAME }}
          RDM_NWR_CONSUMER_PASSWORD: ${{ secrets.RDM_NWR_CONSUMER_PASSWORD }}
          RDM_TD_GROUP_ID: ${{ secrets.RDM_TD_GROUP_ID }}
          RDM_TD_TOPIC: ${{ secrets.RDM_TD_TOPIC }}
          RDM_POLL_SECONDS: "12"
        run: python jacobitetrack/scripts/darwin_feed.py

      - name: Collect mapped station departure boards and seven-day works notices
        env:
          RDM_MODE: ldb
          RDM_LDB_API_KEY: ${{ secrets.RDM_LDB_API_KEY }}
          # Optional authorised source: JSON {"works":[{"title","start","end","stations","url"}]}.
          # If not configured the app clearly says engineering works data unavailable.
          RAIL_PLANNED_WORKS_URL: ${{ secrets.RAIL_PLANNED_WORKS_URL }}
          RAIL_PLANNED_WORKS_TOKEN: ${{ secrets.RAIL_PLANNED_WORKS_TOKEN }}
          # Optional licensed published timetable: JSON {"crossings":[{"at":"ISO8601","direction":"mallaig|fort_william","id":"..."}]}.
          RAIL_FUTURE_TIMETABLE_URL: ${{ secrets.RAIL_FUTURE_TIMETABLE_URL }}
          RAIL_FUTURE_TIMETABLE_TOKEN: ${{ secrets.RAIL_FUTURE_TIMETABLE_TOKEN }}
        run: python jacobitetrack/scripts/darwin_feed.py

      - name: Publish updated feed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/rail-feed-state.json jacobitetrack/feed.json
          if git diff --cached --quiet; then
            echo "No feed changes to publish."
          else
            git commit -m "Refresh live West Highland train feed"
            git fetch origin main
            git rebase origin/main
            git push origin HEAD:main
          fi

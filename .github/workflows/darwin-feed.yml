name: Refresh West Highland station boards

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/darwin-feed.yml
      - jacobitetrack/scripts/darwin_feed.py
      - jacobitetrack/tests/**
  schedule:
    # Avoid the busy top of the hour; GitHub may still delay scheduled runs.
    - cron: "*/5 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: darwin-feed
  cancel-in-progress: false

jobs:
  refresh:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out the site
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Validate feed generator syntax
        run: python -m py_compile jacobitetrack/scripts/darwin_feed.py

      - name: Test station-board movement predictions and timetable handling
        run: python -m unittest discover -s jacobitetrack/tests -p 'test_*.py'

      - name: Collect arrival and departure boards and seven-day works notices
        env:
          RDM_MODE: ldb
          RDM_LDB_API_KEY: ${{ secrets.RDM_LDB_API_KEY }}
          # Optional authorised source: JSON {"works":[{"title","start","end","stations","url"}]}.
          # If not configured the app clearly says engineering works data unavailable.
          RAIL_PLANNED_WORKS_URL: ${{ secrets.RAIL_PLANNED_WORKS_URL }}
          RAIL_PLANNED_WORKS_TOKEN: ${{ secrets.RAIL_PLANNED_WORKS_TOKEN }}
          # Optional licensed published timetable: JSON {"crossings":[{"at":"ISO8601","direction":"mallaig|fort_william","id":"..."}]}.
          RAIL_FUTURE_TIMETABLE_URL: ${{ secrets.RAIL_FUTURE_TIMETABLE_URL }}
          RAIL_FUTURE_TIMETABLE_TOKEN: ${{ secrets.RAIL_FUTURE_TIMETABLE_TOKEN }}
        run: python jacobitetrack/scripts/darwin_feed.py

      - name: Publish updated feed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/rail-feed-state.json jacobitetrack/feed.json
          if git diff --cached --quiet; then
            echo "No feed changes to publish."
          else
            git commit -m "Refresh live West Highland train feed"
            git fetch origin main
            git rebase origin/main
            git push origin HEAD:main
          fi
